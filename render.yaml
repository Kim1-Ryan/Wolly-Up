services:
  - type: web
    name: wolly-up
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wolly-up-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://kim1-ryan.github.io

databases:
  - name: wolly-up-db
    plan: free
    databaseName: wolly_up
    user: wolly_up
    ipAllowList: []
